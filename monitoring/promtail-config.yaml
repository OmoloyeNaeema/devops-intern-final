server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nomad-nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nomad-nginx
          service: nginx-app
          __path__: /var/lib/nomad/alloc/*/alloc/logs/nginx.stdout.*

    pipeline_stages:
      - regex:
          expression: '.*'
