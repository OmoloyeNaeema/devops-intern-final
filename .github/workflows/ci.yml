
name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Shell Scripts and Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t devops-intern-final:${{ github.sha }} \
            ./app

  test:
    name: Test Docker Container
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t devops-intern-final:${{ github.sha }} \
            ./app

      - name: Start Docker Container
        run: |
          docker run -d \
            --name test-app \
            -p 8080:8080 \
            devops-intern-final:${{ github.sha }}

      - name: Wait for Application
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done

          echo "ERROR: Application failed to become ready."
          docker logs test-app
          exit 1

      - name: Run Healthcheck Script
        run: bash scripts/healthcheck.sh http://localhost:8080

      - name: Stop Docker Container
        if: always()
        run: docker stop test-app || true

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
